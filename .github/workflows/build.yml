name: 构建并发布 APK

# 触发条件：推送 v* 形式的 tag（如 v1.0.0、v0.3.2）
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:    # 支持手动触发

permissions:
  contents: write   # 用于创建 release 和上传资源

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 设置 JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: 配置 Android SDK
        uses: android-actions/setup-android@v3

      - name: 设置 Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: ${{ github.ref != 'refs/heads/main' }}

      - name: 构建 debug APK
        run: ./gradlew assembleDebug --no-daemon

      - name: 复制为统一文件名 app-debug.apk
        run: |
          mkdir -p output
          cp app/build/outputs/apk/debug/app-debug.apk output/app-debug.apk
          ls -lh output/app-debug.apk

      - name: 计算 APK 信息
        id: info
        run: |
          SIZE=$(stat -c%s output/app-debug.apk)
          SHA=$(sha256sum output/app-debug.apk | cut -d' ' -f1)
          echo "size=$SIZE" >> $GITHUB_OUTPUT
          echo "sha256=$SHA" >> $GITHUB_OUTPUT
          echo "APK 大小: $((SIZE/1024/1024)) MB"
          echo "SHA256: $SHA"

      - name: 创建/更新 GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: ${{ github.ref_name }}
          generate_release_notes: true
          body: |
            ## 秦大象棋 ${{ github.ref_name }}

            自动构建产物。
            - 大小：${{ steps.info.outputs.size }} 字节
            - SHA256：`${{ steps.info.outputs.sha256 }}`

            安装提示：必须开启「未知来源应用」安装权限。
          files: |
            output/app-debug.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
